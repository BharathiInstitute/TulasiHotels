# ────────────────────────────────────────────────────────
# Loop 2 — Continuous Deployment Pipeline
# Deploys selected release targets on explicit manual dispatch.
# ────────────────────────────────────────────────────────
name: "Loop 2 — Deploy"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - web
          - android
          - windows
          - apps
          - both
        default: both
      android_changelog:
        description: "Android release notes stored in version.json"
        required: false
        type: string
        default: "Bug fixes and improvements"
      android_force_update:
        description: "Mark this Android release as mandatory"
        required: false
        type: boolean
        default: false

# Cancel in-progress runs for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Deploy Web to Firebase Hosting ───
  deploy-web:
    name: "Deploy Web → Firebase Hosting"
    runs-on: ubuntu-latest
    if: ${{ inputs.target == 'web' || inputs.target == 'both' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web (release)
        run: flutter build web --release --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting:login1-aa21c
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

  # ─── Build Release APK ───
  build-release-apk:
    name: "Build Release APK"
    runs-on: ubuntu-latest
    if: ${{ inputs.target == 'android' || inputs.target == 'apps' || inputs.target == 'both' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Android signing secrets
        run: |
          [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] || (echo "Missing GitHub secret: KEYSTORE_BASE64" && exit 1)
          [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] || (echo "Missing GitHub secret: KEYSTORE_PASSWORD" && exit 1)
          [ -n "${{ secrets.KEY_PASSWORD }}" ] || (echo "Missing GitHub secret: KEY_PASSWORD" && exit 1)
          [ -n "${{ secrets.KEY_ALIAS }}" ] || (echo "Missing GitHub secret: KEY_ALIAS" && exit 1)
          [ -n "${{ secrets.EXPECTED_UPLOAD_SHA1 }}" ] || (echo "Missing GitHub secret: EXPECTED_UPLOAD_SHA1" && exit 1)
          [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ] || (echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT" && exit 1)

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          expectedSha1=${{ secrets.EXPECTED_UPLOAD_SHA1 }}
          EOF

      - name: Build Release APK
        run: flutter build apk --release --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}

      - name: Build App Bundle (AAB) for Play Store
        run: flutter build appbundle --release --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}

      - name: Verify AAB upload key SHA1
        run: |
          ACTUAL_SHA1=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | awk -F': ' '/SHA1:/{print $2; exit}' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA1=$(echo "${{ secrets.EXPECTED_UPLOAD_SHA1 }}" | tr '[:lower:]' '[:upper:]')
          echo "AAB SHA1: $ACTUAL_SHA1"
          echo "Expected: $EXPECTED_SHA1"
          [ "$ACTUAL_SHA1" = "$EXPECTED_SHA1" ] || (echo "AAB signing SHA1 mismatch" && exit 1)

      - name: Create Android update metadata
        env:
          ANDROID_CHANGELOG: ${{ github.event.inputs.android_changelog || 'Bug fixes and improvements' }}
          ANDROID_FORCE_UPDATE: ${{ github.event.inputs.android_force_update || 'false' }}
        run: |
          APP_VERSION=$(sed -nE 's/^version:[[:space:]]*([^+]+)\+[0-9]+.*/\1/p' pubspec.yaml | head -n 1)
          BUILD_NUMBER=$(sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' pubspec.yaml | head -n 1)
          test -n "$APP_VERSION" && test -n "$BUILD_NUMBER"
          APK_NAME="TulasiRestaurants_v${APP_VERSION}+${BUILD_NUMBER}.apk"
          DOWNLOAD_URL="https://firebasestorage.googleapis.com/v0/b/login1-aa21c.firebasestorage.app/o/downloads%2Fandroid%2F${APK_NAME}?alt=media"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f installer/android-version.json ] && [ "$(jq -r '.version // empty' installer/android-version.json)" = "$APP_VERSION" ]; then
            ANDROID_CHANGELOG=$(jq -r '.changelog // "Bug fixes and improvements"' installer/android-version.json)
            ANDROID_FORCE_UPDATE=$(jq -r '.forceUpdate // false' installer/android-version.json)
          fi
          jq -n \
            --arg version "$APP_VERSION" \
            --argjson buildNumber "$BUILD_NUMBER" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --arg changelog "$ANDROID_CHANGELOG" \
            --argjson forceUpdate "$ANDROID_FORCE_UPDATE" \
            '{version: $version, buildNumber: $buildNumber, downloadUrl: $downloadUrl, changelog: $changelog, forceUpdate: $forceUpdate}' \
            > installer/android-version.json
          {
            echo "ANDROID_APK_NAME=$APK_NAME"
            echo "ANDROID_VERSION=$APP_VERSION"
          } >> "$GITHUB_ENV"

      - name: Authenticate for Firebase Storage
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload APK and version metadata to Firebase Storage
        run: |
          STORAGE_PATH="gs://login1-aa21c.firebasestorage.app/downloads/android"
          gsutil -h "Cache-Control:no-cache,max-age=0" cp installer/android-version.json "$STORAGE_PATH/version.json"
          gsutil -h "Content-Type:application/vnd.android.package-archive" -h "Cache-Control:no-cache,max-age=0" cp build/app/outputs/flutter-apk/app-release.apk "$STORAGE_PATH/TulasiRestaurants.apk"
          gsutil -h "Content-Type:application/vnd.android.package-archive" -h "Cache-Control:no-cache,max-age=0" cp build/app/outputs/flutter-apk/app-release.apk "$STORAGE_PATH/$ANDROID_APK_NAME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Optional: Upload to Play Store internal track via fastlane
      # Uncomment when fastlane is configured
      # - name: Upload to Play Store (internal track)
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
      #     packageName: in.liteapp.tulasihotels
      #     releaseFiles: build/app/outputs/bundle/release/app-release.aab
      #     track: internal
      #     status: completed

  # ─── Build Windows installer ───
  build-windows-installer:
    name: "Build Windows Installer"
    runs-on: windows-latest
    if: ${{ inputs.target == 'windows' || inputs.target == 'apps' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)\+' | Select-Object -First 1).Matches.Groups[1].Value
          (Get-Content installer\windows\TulasiRestaurants_Installer.iss -Raw) -replace '#define MyAppVersion "[\d.]+"', "#define MyAppVersion `"$version`"" | Set-Content installer\windows\TulasiRestaurants_Installer.iss -NoNewline
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\TulasiRestaurants_Installer.iss

      - name: Create Windows update metadata
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+]+)\+(\d+)' | Select-Object -First 1
          $version = $match.Matches.Groups[1].Value
          $buildNumber = [int]$match.Matches.Groups[2].Value
          $installerName = "TulasiRestaurants_Setup_v$version+$buildNumber.exe"
          $downloadUrl = "https://firebasestorage.googleapis.com/v0/b/login1-aa21c.firebasestorage.app/o/downloads%2Fwindows%2F$installerName`?alt=media"
          [ordered]@{
            version = $version
            buildNumber = $buildNumber
            exeDownloadUrl = $downloadUrl
            storeUrl = 'https://apps.microsoft.com/detail/tulasi-stores'
            changelog = 'Bug fixes and improvements'
            forceUpdate = $false
          } | ConvertTo-Json | Set-Content installer\version.json -NoNewline
          "WINDOWS_INSTALLER_NAME=$installerName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Authenticate for Firebase Storage
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload Windows installer and version metadata
        shell: pwsh
        run: |
          $storagePath = 'gs://login1-aa21c.firebasestorage.app/downloads/windows'
          $installerPath = 'build\installer\TulasiRestaurants_Setup.exe'
          gsutil -h 'Cache-Control:no-cache,max-age=0' cp installer\version.json "$storagePath/version.json"
          gsutil -h 'Content-Type:application/octet-stream' -h 'Cache-Control:no-cache,max-age=0' cp $installerPath "$storagePath/TulasiRestaurants_Setup.exe"
          gsutil -h 'Content-Type:application/octet-stream' -h 'Cache-Control:no-cache,max-age=0' cp $installerPath "$storagePath/$env:WINDOWS_INSTALLER_NAME"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-installer
          path: build/installer/TulasiRestaurants_Setup.exe
          retention-days: 30

  # ─── Deploy Cloud Functions ───
  deploy-functions:
    name: "Deploy Cloud Functions"
    runs-on: ubuntu-latest
    if: ${{ inputs.target == 'both' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: cd functions && npm ci

      - name: Audit dependencies
        run: cd functions && npm audit --audit-level=high || echo "⚠️ Vulnerabilities found (non-blocking)"

      - name: Build functions
        run: cd functions && npm run build

      - name: Run Cloud Functions tests
        run: cd functions && npm test

      - name: Validate Razorpay secrets
        run: |
          [ -n "${{ secrets.RAZORPAY_KEY_ID }}" ] || (echo "Missing GitHub secret: RAZORPAY_KEY_ID" && exit 1)
          [ -n "${{ secrets.RAZORPAY_KEY_SECRET }}" ] || (echo "Missing GitHub secret: RAZORPAY_KEY_SECRET" && exit 1)
          [ -n "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" ] || (echo "Missing GitHub secret: RAZORPAY_WEBHOOK_SECRET" && exit 1)

      - name: Create functions .env from secrets
        run: |
          cat > functions/.env <<EOF
          BREVO_EMAIL=support@restaurants.tulasierp.com
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          EOF

      - name: Deploy Cloud Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

  # ─── Deploy Firestore Rules & Indexes ───
  deploy-rules:
    name: "Deploy Firestore Rules"
    runs-on: ubuntu-latest
    if: ${{ inputs.target == 'both' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Firestore Rules & Indexes
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules,firestore:indexes,storage
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
